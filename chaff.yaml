# OSChaff config (CLI flags override these).
# Run:  python -m oschaff.chaff 035 --group harder-v1 --volume 6 --deceptiveness 8
model: claude-opus-4-8
volume: 5              # 0-10: how much distractor material
deceptiveness: 7      # 0-10: filler -> near-miss -> disarmable traps
source_tasks: cache/osworld_tasks
source_assets: cache/osworld_assets
out_root: forks
