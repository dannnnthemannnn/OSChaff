# OSChaff config — deliberately tiny. Two dials + what to fuzz.
# Everything that protects ground truth is enforced in code, not here.

targets:                 # which service collections to inject noise into
  - MailHub.emails

signal_fraction: 0.5     # VOLUME dial (0,1]. fraction of items that are real.
                         #   1.0 = untouched, 0.5 = 1 distractor per real item,
                         #   0.25 = 3 per real item. lower = more to read.

nastiness: 0.7           # CLOSENESS dial [0,1]. distractor type mix.
                         #   0.0 = harmless filler
                         #   0.5 = mostly near-miss (plausible but wrong)
                         #   1.0 = superseded-heavy (stale conflicting versions)

generator: templated     # templated (offline, deterministic) | llm
seed: 20260724
